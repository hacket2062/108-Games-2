name: Verify release artwork
on:
  workflow_dispatch:
  push:
    branches: [codex/fix-mobile-viewport, codex/verify-mobile-viewport]
permissions:
  contents: read
jobs:
  verify-art:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install application and isolated browser tools
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/art-check" --no-package-lock --no-audit --no-fund playwright
          node "$RUNNER_TEMP/art-check/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Check types, startup and retained game logic
        run: |
          node node_modules/typescript/bin/tsc --noEmit
          npm test
      - name: Build production site
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify grade range and ownership against actual Firestore emulator
        run: |
          npm install --prefix "$RUNNER_TEMP/rules-check" --no-package-lock --no-audit --no-fund firebase-tools @firebase/rules-unit-testing firebase
          node "$RUNNER_TEMP/rules-check/node_modules/firebase-tools/lib/bin/firebase.js" emulators:exec --project demo-early-grades --config firebase.emulator.json --only firestore "node scripts/verify-early-grade-rules.mjs"
        env:
          RULE_TEST_PACKAGE_JSON: ${{ runner.temp }}/rules-check/package.json
      - name: Verify actual artwork, four worlds and retained features
        run: node scripts/verify-release-art.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/art-check/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-art-evidence
          path: .verification/release-art/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify whole mobile viewport, actor scale and feedback with Chromium and WebKit
        run: node scripts/verify-mobile-layout.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/art-check/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-layout-evidence
          path: .verification/mobile-layout/
          if-no-files-found: ignore
          retention-days: 7
